name: CI

on:
  push:
  pull_request:

jobs:
  firmware-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C unit tests
        run: make test
      - name: Check the ground station's sample log matches the C encoder
        run: make sample-log && git diff --exit-code ground/tests/data/sample_flight_raw.csv

  ground-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest
